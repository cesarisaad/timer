<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HIIT & Tabata Pro Timer</title>
  <meta name="theme-color" content="#000000">

  <!-- Favicon e Ícono de App -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%23121212'/><path d='M100 210 h40 v92 h-40 z M372 210 h40 v92 h-40 z M140 230 h30 v52 h-30 z M342 230 h30 v52 h-30 z M170 246 h172 v20 h-172 z' fill='%23f39c12'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%23121212'/><path d='M100 210 h40 v92 h-40 z M372 210 h40 v92 h-40 z M140 230 h30 v52 h-30 z M342 230 h30 v52 h-30 z M170 246 h172 v20 h-172 z' fill='%23f39c12'/></svg>">

  <link rel="manifest" href="data:application/manifest+json,{
    %22name%22:%22Tabata%20Pro%20Timer%22,
    %22short_name%22:%22TabataTimer%22,
    %22start_url%22:%22.%22,
    %22display%22:%22fullscreen%22,
    %22background_color%22:%22%23000000%22,
    %22theme_color%22:%22%23000000%22,
    %22icons%22:[{
      %22src%22:%22data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%23121212'/><path d='M100 210 h40 v92 h-40 z M372 210 h40 v92 h-40 z M140 230 h30 v52 h-30 z M342 230 h30 v52 h-30 z M170 246 h172 v20 h-172 z' fill='%23f39c12'/></svg>%22,
      %22sizes%22:%22512x512%22,
      %22type%22:%22image/svg+xml%22,
      %22purpose%22:%22any%20maskable%22
    }]
  }">

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --prep-color: #f39c12;
      --work-color: #e74c3c;
      --rest-color: #2ecc71;
      --accent: #3498db;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* Soporte para el área segura de la barra inferior de Android */
    body { 
      background-color: var(--bg-color); 
      color: var(--text-color); 
      display: flex; 
      flex-direction: column; 
      height: 100vh;
      height: 100dvh;
      overflow: hidden; 
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    header { background: #000; padding: 12px; text-align: center; border-bottom: 1px solid #333; }
    header h1 { font-size: 1.1rem; letter-spacing: 1px; color: var(--prep-color); }

    nav { display: flex; background: #1a1a1a; border-bottom: 1px solid #333; }
    nav button { flex: 1; padding: 10px; background: none; border: none; color: #888; font-weight: bold; font-size: 0.85rem; cursor: pointer; }
    nav button.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: #222; }

    .view { display: none; padding: 12px; overflow-y: auto; height: calc(100vh - 90px); }
    .view.active { display: block; }

    .form-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; font-size: 0.8rem; color: #aaa; }
    input[type="number"], input[type="text"], select { width: 100%; padding: 10px; background: var(--card-bg); border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 0.95rem; }

    .preset-card { background: #181818; border: 1px solid #333; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
    .preset-actions { display: flex; gap: 6px; margin-top: 8px; }

    .total-time-badge { background: #2a2a2a; border: 1px solid var(--accent); border-radius: 8px; padding: 8px; text-align: center; margin-bottom: 10px; font-size: 0.9rem; }
    .total-time-badge strong { color: var(--accent); font-size: 1rem; }

    .exercise-list { margin-top: 8px; list-style: none; }
    .exercise-item { background: var(--card-bg); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--accent); }
    .exercise-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 6px; }
    .exercise-params { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; font-size: 0.75rem; color: #aaa; }
    .exercise-params span { background: #121212; padding: 4px; border-radius: 4px; text-align: center; }

    .btn-danger { background: #c0392b; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .btn-main { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }

    #timer-screen { text-align: center; display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding-bottom: 10px; }
    .timer-display-container { position: relative; margin: 10px auto; width: 240px; height: 240px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(0, 0, 0, 0.4); box-shadow: inset 0 0 20px rgba(0,0,0,0.8); overflow: hidden; }
    #timer-blur-bg { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: var(--prep-color); filter: blur(25px); opacity: 0.85; transition: height 0.3s ease-out, background-color 0.5s ease; z-index: 1; }
    #time-display { font-size: 5.5rem; font-weight: 800; font-family: monospace; line-height: 1; position: relative; z-index: 2; text-shadow: 0 4px 10px rgba(0,0,0,0.9); }

    #phase-display { font-size: 1.8rem; font-weight: bold; text-transform: uppercase; margin-top: 5px; }
    #exercise-display { font-size: 1.2rem; color: #eee; }
    #progress-display { font-size: 0.95rem; color: #aaa; }
    #total-workout-timer { font-size: 0.85rem; color: #888; }

    .timer-controls { display: flex; gap: 10px; margin-top: 8px; }
    .timer-controls button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; color: #fff; cursor: pointer; }
    #btn-pause { background: #f39c12; }
    #btn-stop { background: #e74c3c; }

    #toast-msg { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 25px; padding: 10px 18px; position: fixed; z-index: 1000; left: 50%; bottom: 40px; transform: translateX(-50%); font-size: 0.85rem; border: 1px solid #555; opacity: 0; transition: opacity 0.3s, visibility 0.3s; }
    #toast-msg.show { visibility: visible; opacity: 1; }

    .history-item { background: var(--card-bg); padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--accent); }
  </style>
</head>
<body>

  <header>
    <h1>TABATA & HIIT TIMER</h1>
  </header>

  <nav>
    <button id="nav-config" class="active" onclick="switchView('config-view')">Configurar</button>
    <button id="nav-timer" onclick="switchView('timer-view')">Reloj</button>
    <button id="nav-history" onclick="switchView('history-view')">Historial</button>
  </nav>

  <!-- Vista 1: Configuración -->
  <div id="config-view" class="view active">
    
    <!-- Módulo de Presets Guardados -->
    <div class="preset-card">
      <label><strong>Rutinas Guardadas (Presets):</strong></label>
      <select id="preset-selector" onchange="loadSelectedPreset()">
        <option value="">-- Seleccionar rutina guardada --</option>
      </select>
      <div class="preset-actions">
        <input type="text" id="preset-name" placeholder="Nombre de la rutina...">
        <button onclick="saveCurrentPreset()" style="padding: 8px 12px; background: #2980b9; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap;">Guardar/Editar</button>
        <button onclick="deleteSelectedPreset()" class="btn-danger" style="border-radius: 6px;">Eliminar</button>
      </div>
    </div>

    <div class="total-time-badge">
      Tiempo Total de la Sesión: <strong id="calculated-total-time">00:00 min</strong>
    </div>

    <div class="form-group">
      <label>Nombre del Ejercicio</label>
      <input type="text" id="ex-name" placeholder="Ej: Flexiones, Sentadillas...">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px;">
      <div class="form-group"><label>Prep(s)</label><input type="number" id="prep-time" value="10" min="0"></div>
      <div class="form-group"><label>Trabajo</label><input type="number" id="work-time" value="20" min="1"></div>
      <div class="form-group"><label>Descanso</label><input type="number" id="rest-time" value="10" min="0"></div>
      <div class="form-group"><label>Series</label><input type="number" id="sets-count" value="4" min="1"></div>
    </div>

    <button onclick="addExercise()" style="width: 100%; padding: 10px; background: #27ae60; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 12px;">+ Agregar Ejercicio</button>

    <h3 style="font-size: 0.85rem; color: #aaa; margin-bottom: 6px;">Lista de Ejercicios en la Sesión:</h3>
    <ul id="exercise-list" class="exercise-list"></ul>

    <button class="btn-main" onclick="startWorkout()">¡COMENZAR ENTRENAMIENTO!</button>
  </div>

  <!-- Vista 2: Temporizador -->
  <div id="timer-view" class="view">
    <div id="timer-screen">
      <div>
        <div id="phase-display">PREPARADOS</div>
        <div id="exercise-display">Ejercicio</div>
      </div>

      <div class="timer-display-container">
        <div id="timer-blur-bg"></div>
        <div id="time-display">00</div>
      </div>

      <div>
        <div id="progress-display">Serie 0/0 | Ejercicio 0/0</div>
        <div id="total-workout-timer">Tiempo Sesión: 00:00 / 00:00</div>
        
        <div class="timer-controls">
          <button id="btn-pause" onclick="togglePause()">Pausar</button>
          <button id="btn-stop" onclick="stopWorkout()">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Vista 3: Historial -->
  <div id="history-view" class="view">
    <h3 style="margin-bottom: 12px;">Sesiones Recientes</h3>
    <div id="history-container"></div>
    <button onclick="clearHistory()" style="background: none; border: 1px solid #444; color: #888; padding: 8px; width: 100%; margin-top: 12px; border-radius: 5px;">Limpiar Historial</button>
  </div>

  <div id="toast-msg">Presiona "Atrás" nuevamente para salir</div>

  <script>
    let exercises = [
      { name: "Flexiones", prep: 10, work: 20, rest: 10, sets: 4 },
      { name: "Sentadillas", prep: 5, work: 30, rest: 15, sets: 3 }
    ];

    let workoutState = {
      currentExIndex: 0, currentSet: 1, currentPhase: 'PREP',
      timeRemaining: 0, phaseTotalTime: 0, isPaused: false, timerInterval: null,
      wakeLock: null, totalDuration: 0, estimatedTotalSeconds: 0
    };

    function enableFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
      else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen().catch(() => {});
    }

    function initBackButtonHandler() {
      let lastBackPress = 0;
      history.pushState({ page: 1 }, "", "");
      window.addEventListener('popstate', function (event) {
        const now = new Date().getTime();
        if (now - lastBackPress < 2000) {
          navigator.app ? navigator.app.exitApp() : window.history.back();
        } else {
          lastBackPress = now;
          showToast();
          history.pushState({ page: 1 }, "", "");
        }
      });
    }

    function showToast() {
      const toast = document.getElementById("toast-msg");
      toast.classList.add("show");
      setTimeout(() => { toast.classList.remove("show"); }, 1800);
    }

    initBackButtonHandler();

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function calculateTotalWorkoutTime() {
      let totalSeconds = 0;
      exercises.forEach(ex => {
        totalSeconds += ex.prep + ((ex.work + ex.rest) * ex.sets);
      });
      workoutState.estimatedTotalSeconds = totalSeconds;
      document.getElementById('calculated-total-time').textContent = `${formatTime(totalSeconds)} min`;
    }

    // --- Sistema de Presets ---
    function getStoredPresets() {
      return JSON.parse(localStorage.getItem('hiit_presets') || '{}');
    }

    function renderPresetSelector() {
      const presets = getStoredPresets();
      const selector = document.getElementById('preset-selector');
      selector.innerHTML = '<option value="">-- Seleccionar rutina guardada --</option>';
      Object.keys(presets).forEach(name => {
        selector.innerHTML += `<option value="${name}">${name}</option>`;
      });
    }

    function saveCurrentPreset() {
      const nameInput = document.getElementById('preset-name');
      const name = nameInput.value.trim();
      if (!name) { alert("Ingresa un nombre para la rutina."); return; }
      if (exercises.length === 0) { alert("Agrega al menos un ejercicio antes de guardar."); return; }

      const presets = getStoredPresets();
      presets[name] = [...exercises];
      localStorage.setItem('hiit_presets', JSON.stringify(presets));
      renderPresetSelector();
      document.getElementById('preset-selector').value = name;
      alert(`Rutina "${name}" guardada/actualizada correctamente.`);
    }

    function loadSelectedPreset() {
      const selector = document.getElementById('preset-selector');
      const selected = selector.value;
      if (!selected) return;

      const presets = getStoredPresets();
      if (presets[selected]) {
        exercises = [...presets[selected]];
        document.getElementById('preset-name').value = selected;
        renderExercises();
      }
    }

    function deleteSelectedPreset() {
      const selector = document.getElementById('preset-selector');
      const selected = selector.value;
      if (!selected) { alert("Selecciona una rutina para eliminar."); return; }

      if (confirm(`¿Eliminar la rutina "${selected}"?`)) {
        const presets = getStoredPresets();
        delete presets[selected];
        localStorage.setItem('hiit_presets', JSON.stringify(presets));
        document.getElementById('preset-name').value = '';
        renderPresetSelector();
      }
    }

    // --- Audio System ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 440, duration = 0.12) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    function playChime() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);
        }, idx * 120);
      });
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          workoutState.wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) { console.log("WakeLock error:", err); }
    }

    function releaseWakeLock() {
      if (workoutState.wakeLock) {
        workoutState.wakeLock.release();
        workoutState.wakeLock = null;
      }
    }

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      
      if(viewId === 'config-view') document.getElementById('nav-config').classList.add('active');
      if(viewId === 'timer-view') document.getElementById('nav-timer').classList.add('active');
      if(viewId === 'history-view') {
        document.getElementById('nav-history').classList.add('active');
        renderHistory();
      }
    }

    function renderExercises() {
      const list = document.getElementById('exercise-list');
      list.innerHTML = '';
      exercises.forEach((ex, idx) => {
        list.innerHTML += `
          <li class="exercise-item">
            <div class="exercise-header">
              <span>${idx + 1}. ${ex.name}</span>
              <button class="btn-danger" onclick="removeExercise(${idx})">✕</button>
            </div>
            <div class="exercise-params">
              <span>Trabajo: ${ex.work}s</span>
              <span>Descanso: ${ex.rest}s</span>
              <span>Series: ${ex.sets}</span>
            </div>
          </li>`;
      });
      calculateTotalWorkoutTime();
    }

    function addExercise() {
      const nameInput = document.getElementById('ex-name');
      const prep = parseInt(document.getElementById('prep-time').value) || 0;
      const work = parseInt(document.getElementById('work-time').value) || 20;
      const rest = parseInt(document.getElementById('rest-time').value) || 10;
      const sets = parseInt(document.getElementById('sets-count').value) || 1;

      const name = nameInput.value.trim() !== '' ? nameInput.value.trim() : `Ejercicio ${exercises.length + 1}`;

      exercises.push({ name, prep, work, rest, sets });
      nameInput.value = '';
      renderExercises();
    }

    function removeExercise(idx) {
      exercises.splice(idx, 1);
      renderExercises();
    }

    function resetTimerScreen() {
      if (workoutState.timerInterval) {
        clearInterval(workoutState.timerInterval);
        workoutState.timerInterval = null;
      }
      releaseWakeLock();

      workoutState.timeRemaining = 0;
      workoutState.phaseTotalTime = 0;
      workoutState.totalDuration = 0;
      workoutState.currentExIndex = 0;
      workoutState.currentSet = 1;
      workoutState.isPaused = false;

      document.getElementById('time-display').textContent = '00';
      document.getElementById('phase-display').textContent = 'PREPARADOS';
      document.getElementById('phase-display').style.color = 'var(--prep-color)';
      document.getElementById('exercise-display').textContent = 'Listo para empezar';
      document.getElementById('progress-display').textContent = 'Serie 0/0 | Ejercicio 0/0';
      document.getElementById('total-workout-timer').textContent = 'Tiempo Sesión: 00:00 / 00:00';
      document.getElementById('timer-blur-bg').style.height = '0%';
      document.getElementById('btn-pause').textContent = 'Pausar';
    }

    function startWorkout() {
      if (exercises.length === 0) {
        alert("Agrega al menos un ejercicio a la lista.");
        return;
      }

      enableFullscreen();
      workoutState.currentExIndex = 0;
      workoutState.currentSet = 1;
      
      const currentEx = exercises[0];
      if (currentEx.prep > 0) {
        workoutState.currentPhase = 'PREP';
        workoutState.timeRemaining = currentEx.prep;
        workoutState.phaseTotalTime = currentEx.prep;
      } else {
        workoutState.currentPhase = 'WORK';
        workoutState.timeRemaining = currentEx.work;
        workoutState.phaseTotalTime = currentEx.work;
      }

      workoutState.isPaused = false;
      workoutState.totalDuration = 0;

      requestWakeLock();
      switchView('timer-view');
      updateDisplay();
      
      if (workoutState.timerInterval) clearInterval(workoutState.timerInterval);
      workoutState.timerInterval = setInterval(tick, 1000);
    }

    function tick() {
      if (workoutState.isPaused) return;

      workoutState.totalDuration++;

      if (workoutState.timeRemaining <= 5 && workoutState.timeRemaining > 1) {
        playBeep(440, 0.12);
      } else if (workoutState.timeRemaining === 1) {
        checkUpcomingSound();
      }

      if (workoutState.timeRemaining > 1) {
        workoutState.timeRemaining--;
      } else {
        nextPhase();
      }
      updateDisplay();
    }

    function checkUpcomingSound() {
      const currentEx = exercises[workoutState.currentExIndex];
      const isLastSet = workoutState.currentSet === currentEx.sets;
      const isRestPhase = workoutState.currentPhase === 'REST';
      const isWorkPhaseNoRest = (workoutState.currentPhase === 'WORK' && currentEx.rest === 0);

      if (isLastSet && (isRestPhase || isWorkPhaseNoRest)) {
        if (workoutState.currentExIndex < exercises.length - 1) {
          playChime();
          return;
        }
      }
      playBeep(880, 0.35);
    }

    function nextPhase() {
      const currentEx = exercises[workoutState.currentExIndex];

      if (workoutState.currentPhase === 'PREP') {
        workoutState.currentPhase = 'WORK';
        workoutState.timeRemaining = currentEx.work;
        workoutState.phaseTotalTime = currentEx.work;
      } else if (workoutState.currentPhase === 'WORK') {
        if (currentEx.rest > 0) {
          workoutState.currentPhase = 'REST';
          workoutState.timeRemaining = currentEx.rest;
          workoutState.phaseTotalTime = currentEx.rest;
        } else {
          advanceSetOrExercise();
        }
      } else if (workoutState.currentPhase === 'REST') {
        advanceSetOrExercise();
      }
    }

    function advanceSetOrExercise() {
      const currentEx = exercises[workoutState.currentExIndex];

      if (workoutState.currentSet < currentEx.sets) {
        workoutState.currentSet++;
        workoutState.currentPhase = 'WORK';
        workoutState.timeRemaining = currentEx.work;
        workoutState.phaseTotalTime = currentEx.work;
      } else {
        if (workoutState.currentExIndex < exercises.length - 1) {
          workoutState.currentExIndex++;
          workoutState.currentSet = 1;
          const nextEx = exercises[workoutState.currentExIndex];

          if (nextEx.prep > 0) {
            workoutState.currentPhase = 'PREP';
            workoutState.timeRemaining = nextEx.prep;
            workoutState.phaseTotalTime = nextEx.prep;
          } else {
            workoutState.currentPhase = 'WORK';
            workoutState.timeRemaining = nextEx.work;
            workoutState.phaseTotalTime = nextEx.work;
          }
        } else {
          finishWorkout();
        }
      }
    }

    function updateDisplay() {
      const phaseEl = document.getElementById('phase-display');
      const timeEl = document.getElementById('time-display');
      const exEl = document.getElementById('exercise-display');
      const progEl = document.getElementById('progress-display');
      const totalTimerEl = document.getElementById('total-workout-timer');
      const blurBg = document.getElementById('timer-blur-bg');

      const currentEx = exercises[workoutState.currentExIndex];

      timeEl.textContent = workoutState.timeRemaining < 10 ? '0' + workoutState.timeRemaining : workoutState.timeRemaining;
      exEl.textContent = currentEx.name;
      progEl.textContent = `Serie ${workoutState.currentSet}/${currentEx.sets} | Ejercicio ${workoutState.currentExIndex + 1}/${exercises.length}`;
      
      totalTimerEl.textContent = `Tiempo Sesión: ${formatTime(workoutState.totalDuration)} / ${formatTime(workoutState.estimatedTotalSeconds)}`;

      const elapsed = workoutState.phaseTotalTime - workoutState.timeRemaining;
      const progressPercent = Math.min(100, Math.max(0, (elapsed / workoutState.phaseTotalTime) * 100));
      blurBg.style.height = `${progressPercent}%`;

      if (workoutState.currentPhase === 'PREP') {
        phaseEl.textContent = "PREPARADOS";
        phaseEl.style.color = "var(--prep-color)";
        blurBg.style.backgroundColor = "var(--prep-color)";
      } else if (workoutState.currentPhase === 'WORK') {
        phaseEl.textContent = "¡TRABAJO!";
        phaseEl.style.color = "var(--work-color)";
        blurBg.style.backgroundColor = "var(--work-color)";
      } else if (workoutState.currentPhase === 'REST') {
        phaseEl.textContent = "DESCANSO";
        phaseEl.style.color = "var(--rest-color)";
        blurBg.style.backgroundColor = "var(--rest-color)";
      }
    }

    function togglePause() {
      workoutState.isPaused = !workoutState.isPaused;
      document.getElementById('btn-pause').textContent = workoutState.isPaused ? "Reanudar" : "Pausar";
    }

    function stopWorkout() {
      if (confirm("¿Deseas cancelar la sesión actual?")) {
        resetTimerScreen();
        switchView('config-view');
      }
    }

    function finishWorkout() {
      playChime();
      saveHistory();
      setTimeout(() => {
        alert("¡Entrenamiento Completado! Excelente trabajo.");
        resetTimerScreen();
        switchView('history-view');
      }, 300);
    }

    function saveHistory() {
      const history = JSON.parse(localStorage.getItem('hiit_history') || '[]');
      const session = {
        date: new Date().toLocaleString('es-ES'),
        exercises: exercises.map(e => e.name),
        sets: exercises.reduce((acc, e) => acc + e.sets, 0),
        duration: formatTime(workoutState.totalDuration)
      };
      history.unshift(session);
      localStorage.setItem('hiit_history', JSON.stringify(history));
    }

    function renderHistory() {
      const container = document.getElementById('history-container');
      const history = JSON.parse(localStorage.getItem('hiit_history') || '[]');
      
      if (history.length === 0) {
        container.innerHTML = "<p style='color:#666;'>No hay registros aún.</p>";
        return;
      }

      container.innerHTML = history.map(item => `
        <div class="history-item">
          <div style="font-size:0.8rem; color:#888;">${item.date}</div>
          <div style="font-weight:bold; margin:5px 0;">${item.exercises.join(', ')}</div>
          <div style="font-size:0.85rem; color:#aaa;">Total series: ${item.sets} | Duración: ${item.duration} min</div>
        </div>
      `).join('');
    }

    function clearHistory() {
      if (confirm("¿Borrar todo el historial?")) {
        localStorage.removeItem('hiit_history');
        renderHistory();
      }
    }

    renderPresetSelector();
    renderExercises();
    resetTimerScreen();
  </script>
</body>
</html>
