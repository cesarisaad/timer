<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HIIT & Tabata Pro Timer</title>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="data:application/manifest+json,{
    %22name%22:%22Tabata%20Pro%20Timer%22,
    %22short_name%22:%22TabataTimer%22,
    %22start_url%22:%22.%22,
    %22display%22:%22standalone%22,
    %22background_color%22:%22%23000000%22,
    %22theme_color%22:%22%23000000%22
  }">
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --prep-color: #f39c12;
      --work-color: #e74c3c;
      --rest-color: #2ecc71;
      --accent: #3498db;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
    
    header { background: #000; padding: 15px; text-align: center; border-bottom: 1px solid #333; z-index: 10; }
    h1 { font-size: 1.4rem; color: var(--accent); letter-spacing: 1px; }

    nav { display: flex; background: #000; border-bottom: 1px solid #333; z-index: 10; }
    nav button { flex: 1; padding: 12px; background: none; border: none; color: #888; font-weight: bold; font-size: 0.9rem; cursor: pointer; }
    nav button.active { color: var(--accent); border-bottom: 3px solid var(--accent); }

    .view { display: none; padding: 20px; flex: 1; z-index: 2; }
    .view.active { display: block; }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #aaa; }
    input[type="number"], input[type="text"] { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 1rem; }

    /* Indicador de Tiempo Total */
    .total-time-badge {
      background: #2a2a2a;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 15px;
      font-size: 1rem;
      color: #fff;
    }
    .total-time-badge strong { color: var(--accent); font-size: 1.2rem; }

    .exercise-list { margin-top: 15px; list-style: none; }
    .exercise-item { background: var(--card-bg); padding: 10px 15px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .btn-danger { background: #c0392b; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }

    .btn-main { width: 100%; padding: 15px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }

    /* Pantalla de Temporizador */
    #timer-screen { text-align: center; display: flex; flex-direction: column; justify-content: space-between; height: 78vh; position: relative; }
    
    .timer-display-container {
      position: relative;
      margin: 10px auto;
      width: 270px;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    #timer-blur-bg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: var(--prep-color);
      filter: blur(25px);
      opacity: 0.85;
      transition: height 0.3s ease-out, background-color 0.5s ease;
      z-index: 1;
    }

    #time-display { 
      font-size: 6.5rem; 
      font-weight: 800; 
      font-family: monospace; 
      line-height: 1; 
      position: relative; 
      z-index: 2; 
      text-shadow: 0 4px 10px rgba(0,0,0,0.9);
    }

    #phase-display { font-size: 2.2rem; font-weight: bold; text-transform: uppercase; margin-top: 10px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
    #exercise-display { font-size: 1.5rem; color: #eee; margin-top: 5px; }
    #progress-display { font-size: 1.1rem; color: #aaa; }
    #total-workout-timer { font-size: 0.9rem; color: #888; margin-top: 4px; }

    .timer-controls { display: flex; gap: 10px; }
    .timer-controls button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; color: #fff; cursor: pointer; }
    #btn-pause { background: #f39c12; }
    #btn-stop { background: #e74c3c; }

    /* Historial */
    .history-item { background: var(--card-bg); padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--accent); }
    .history-date { font-size: 0.8rem; color: #888; }
    .history-title { font-weight: bold; margin: 5px 0; }
  </style>
</head>
<body>

  <header>
    <h1>TABATA & HIIT TIMER</h1>
  </header>

  <nav>
    <button id="nav-config" class="active" onclick="switchView('config-view')">Configurar</button>
    <button id="nav-timer" onclick="switchView('timer-view')">Reloj</button>
    <button id="nav-history" onclick="switchView('history-view')">Historial</button>
  </nav>

  <!-- Vista 1: Configuración -->
  <div id="config-view" class="view active">
    
    <!-- Banner de Tiempo Total Estimado -->
    <div class="total-time-badge">
      Tiempo Total de la Sesión: <strong id="calculated-total-time">00:00 min</strong>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div class="form-group">
        <label>Preparación (seg)</label>
        <input type="number" id="prep-time" value="10" min="0" oninput="calculateTotalWorkoutTime()">
      </div>
      <div class="form-group">
        <label>Trabajo (seg)</label>
        <input type="number" id="work-time" value="20" min="1" oninput="calculateTotalWorkoutTime()">
      </div>
      <div class="form-group">
        <label>Descanso (seg)</label>
        <input type="number" id="rest-time" value="10" min="0" oninput="calculateTotalWorkoutTime()">
      </div>
      <div class="form-group">
        <label>Series por Ejercicio</label>
        <input type="number" id="sets-count" value="4" min="1" oninput="calculateTotalWorkoutTime()">
      </div>
    </div>

    <hr style="border: 0.5px solid #333; margin: 15px 0;">

    <div class="form-group">
      <label>Agregar Ejercicio a la Sesión</label>
      <div style="display: flex; gap: 5px;">
        <input type="text" id="ex-name" placeholder="Ej: Flexiones, Sentadillas...">
        <button onclick="addExercise()" style="padding: 0 15px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: bold;">+</button>
      </div>
    </div>

    <ul id="exercise-list" class="exercise-list"></ul>

    <button class="btn-main" onclick="startWorkout()">¡COMENZAR ENTRENAMIENTO!</button>
  </div>

  <!-- Vista 2: Temporizador -->
  <div id="timer-view" class="view">
    <div id="timer-screen">
      <div>
        <div id="phase-display">PREPARADOS</div>
        <div id="exercise-display">Ejercicio</div>
      </div>

      <!-- Reloj con Blur Dinámico -->
      <div class="timer-display-container">
        <div id="timer-blur-bg"></div>
        <div id="time-display">00</div>
      </div>

      <div>
        <div id="progress-display">Serie 1/4 | Ejercicio 1/1</div>
        <div id="total-workout-timer">Tiempo Sesión: 00:00 / 00:00</div>
        <br>
        <div class="timer-controls">
          <button id="btn-pause" onclick="togglePause()">Pausar</button>
          <button id="btn-stop" onclick="stopWorkout()">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Vista 3: Historial -->
  <div id="history-view" class="view">
    <h3 style="margin-bottom: 15px;">Sesiones Recientes</h3>
    <div id="history-container"></div>
    <button onclick="clearHistory()" style="background: none; border: 1px solid #444; color: #888; padding: 8px; width: 100%; margin-top: 15px; border-radius: 5px;">Limpiar Historial</button>
  </div>

  <script>
    // --- Estado de la App ---
    let exercises = ["Entrenamiento HIIT"];
    let workoutState = {
      prep: 10, work: 20, rest: 10, sets: 4,
      currentExIndex: 0, currentSet: 1, currentPhase: 'PREP',
      timeRemaining: 0, phaseTotalTime: 0, isPaused: false, timerInterval: null,
      wakeLock: null, totalDuration: 0, estimatedTotalSeconds: 0
    };

    // --- Auxiliar: Formatear segundos a MM:SS ---
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // --- Cálculo del Tiempo Total del Entrenamiento ---
    function calculateTotalWorkoutTime() {
      const prep = parseInt(document.getElementById('prep-time').value) || 0;
      const work = parseInt(document.getElementById('work-time').value) || 0;
      const rest = parseInt(document.getElementById('rest-time').value) || 0;
      const sets = parseInt(document.getElementById('sets-count').value) || 1;
      const numExercises = exercises.length || 1;

      // Tiempo por ejercicio = Preparación + (Trabajo + Descanso) * Series
      const timePerExercise = prep + ((work + rest) * sets);
      workoutState.estimatedTotalSeconds = timePerExercise * numExercises;

      document.getElementById('calculated-total-time').textContent = `${formatTime(workoutState.estimatedTotalSeconds)} min`;
    }

    // --- Sistema de Audio (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 440, duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    function playChime() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [523.25, 659.25, 783.99]; // Frecuencias musicales Do-Mi-Sol
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.6);
        }, idx * 180);
      });
    }

    // --- Wake Lock (Pantalla Encendida) ---
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          workoutState.wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) { console.log("WakeLock error:", err); }
    }

    function releaseWakeLock() {
      if (workoutState.wakeLock) {
        workoutState.wakeLock.release();
        workoutState.wakeLock = null;
      }
    }

    // --- Navegación ---
    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      
      if(viewId === 'config-view') document.getElementById('nav-config').classList.add('active');
      if(viewId === 'timer-view') document.getElementById('nav-timer').classList.add('active');
      if(viewId === 'history-view') {
        document.getElementById('nav-history').classList.add('active');
        renderHistory();
      }
    }

    // --- Gestión de Ejercicios ---
    function renderExercises() {
      const list = document.getElementById('exercise-list');
      list.innerHTML = '';
      exercises.forEach((ex, idx) => {
        list.innerHTML += `
          <li class="exercise-item">
            <span>${idx + 1}. ${ex}</span>
            <button class="btn-danger" onclick="removeExercise(${idx})">✕</button>
          </li>`;
      });
      calculateTotalWorkoutTime();
    }

    function addExercise() {
      const input = document.getElementById('ex-name');
      if (input.value.trim() !== '') {
        if (exercises.length === 1 && exercises[0] === "Entrenamiento HIIT") exercises = [];
        exercises.push(input.value.trim());
        input.value = '';
        renderExercises();
      }
    }

    function removeExercise(idx) {
      exercises.splice(idx, 1);
      if (exercises.length === 0) exercises = ["Entrenamiento HIIT"];
      renderExercises();
    }

    // --- Lógica del Temporizador ---
    function startWorkout() {
      workoutState.prep = parseInt(document.getElementById('prep-time').value) || 0;
      workoutState.work = parseInt(document.getElementById('work-time').value) || 20;
      workoutState.rest = parseInt(document.getElementById('rest-time').value) || 10;
      workoutState.sets = parseInt(document.getElementById('sets-count').value) || 1;
      
      workoutState.currentExIndex = 0;
      workoutState.currentSet = 1;
      
      if (workoutState.prep > 0) {
        workoutState.currentPhase = 'PREP';
        workoutState.timeRemaining = workoutState.prep;
        workoutState.phaseTotalTime = workoutState.prep;
      } else {
        workoutState.currentPhase = 'WORK';
        workoutState.timeRemaining = workoutState.work;
        workoutState.phaseTotalTime = workoutState.work;
      }

      workoutState.isPaused = false;
      workoutState.totalDuration = 0;

      requestWakeLock();
      switchView('timer-view');
      updateDisplay();
      
      if (workoutState.timerInterval) clearInterval(workoutState.timerInterval);
      workoutState.timerInterval = setInterval(tick, 1000);
    }

    function tick() {
      if (workoutState.isPaused) return;

      workoutState.totalDuration++;

      // Sonido de cuenta regresiva
      if (workoutState.timeRemaining <= 3 && workoutState.timeRemaining > 1) {
        playBeep(440, 0.1);
      } else if (workoutState.timeRemaining === 1) {
        checkUpcomingSound();
      }

      if (workoutState.timeRemaining > 1) {
        workoutState.timeRemaining--;
      } else {
        nextPhase();
      }
      updateDisplay();
    }

    function checkUpcomingSound() {
      const isLastSet = workoutState.currentSet === workoutState.sets;
      const isRestPhase = workoutState.currentPhase === 'REST';
      const isWorkPhaseNoRest = (workoutState.currentPhase === 'WORK' && workoutState.rest === 0);

      if (isLastSet && (isRestPhase || isWorkPhaseNoRest)) {
        if (workoutState.currentExIndex < exercises.length - 1) {
          playChime();
          return;
        }
      }
      playBeep(880, 0.35);
    }

    function nextPhase() {
      if (workoutState.currentPhase === 'PREP') {
        workoutState.currentPhase = 'WORK';
        workoutState.timeRemaining = workoutState.work;
        workoutState.phaseTotalTime = workoutState.work;
      } else if (workoutState.currentPhase === 'WORK') {
        if (workoutState.rest > 0) {
          workoutState.currentPhase = 'REST';
          workoutState.timeRemaining = workoutState.rest;
          workoutState.phaseTotalTime = workoutState.rest;
        } else {
          advanceSetOrExercise();
        }
      } else if (workoutState.currentPhase === 'REST') {
        advanceSetOrExercise();
      }
    }

    function advanceSetOrExercise() {
      if (workoutState.currentSet < workoutState.sets) {
        workoutState.currentSet++;
        workoutState.currentPhase = 'WORK';
        workoutState.timeRemaining = workoutState.work;
        workoutState.phaseTotalTime = workoutState.work;
      } else {
        if (workoutState.currentExIndex < exercises.length - 1) {
          workoutState.currentExIndex++;
          workoutState.currentSet = 1;
          if (workoutState.prep > 0) {
            workoutState.currentPhase = 'PREP';
            workoutState.timeRemaining = workoutState.prep;
            workoutState.phaseTotalTime = workoutState.prep;
          } else {
            workoutState.currentPhase = 'WORK';
            workoutState.timeRemaining = workoutState.work;
            workoutState.phaseTotalTime = workoutState.work;
          }
        } else {
          finishWorkout();
        }
      }
    }

    function updateDisplay() {
      const phaseEl = document.getElementById('phase-display');
      const timeEl = document.getElementById('time-display');
      const exEl = document.getElementById('exercise-display');
      const progEl = document.getElementById('progress-display');
      const totalTimerEl = document.getElementById('total-workout-timer');
      const blurBg = document.getElementById('timer-blur-bg');

      timeEl.textContent = workoutState.timeRemaining < 10 ? '0' + workoutState.timeRemaining : workoutState.timeRemaining;
      exEl.textContent = exercises[workoutState.currentExIndex];
      progEl.textContent = `Serie ${workoutState.currentSet}/${workoutState.sets} | Ejercicio ${workoutState.currentExIndex + 1}/${exercises.length}`;
      
      // Actualizar contador del tiempo total acumulado vs estimación
      totalTimerEl.textContent = `Tiempo Sesión: ${formatTime(workoutState.totalDuration)} / ${formatTime(workoutState.estimatedTotalSeconds)}`;

      // Fondo difuminado
      const elapsed = workoutState.phaseTotalTime - workoutState.timeRemaining;
      const progressPercent = Math.min(100, Math.max(0, (elapsed / workoutState.phaseTotalTime) * 100));
      blurBg.style.height = `${progressPercent}%`;

      // Colores por fase
      if (workoutState.currentPhase === 'PREP') {
        phaseEl.textContent = "PREPARADOS";
        phaseEl.style.color = "var(--prep-color)";
        blurBg.style.backgroundColor = "var(--prep-color)";
      } else if (workoutState.currentPhase === 'WORK') {
        phaseEl.textContent = "¡TRABAJO!";
        phaseEl.style.color = "var(--work-color)";
        blurBg.style.backgroundColor = "var(--work-color)";
      } else if (workoutState.currentPhase === 'REST') {
        phaseEl.textContent = "DESCANSO";
        phaseEl.style.color = "var(--rest-color)";
        blurBg.style.backgroundColor = "var(--rest-color)";
      }
    }

    function togglePause() {
      workoutState.isPaused = !workoutState.isPaused;
      document.getElementById('btn-pause').textContent = workoutState.isPaused ? "Reanudar" : "Pausar";
    }

    function stopWorkout() {
      if (confirm("¿Deseas cancelar la sesión actual?")) {
        clearInterval(workoutState.timerInterval);
        releaseWakeLock();
        switchView('config-view');
      }
    }

    function finishWorkout() {
      clearInterval(workoutState.timerInterval);
      releaseWakeLock();
      playChime();
      setTimeout(() => alert("¡Entrenamiento Completado! Excelente trabajo."), 300);
      saveHistory();
      switchView('history-view');
    }

    // --- Historial (localStorage) ---
    function saveHistory() {
      const history = JSON.parse(localStorage.getItem('hiit_history') || '[]');
      const session = {
        date: new Date().toLocaleString('es-ES'),
        exercises: [...exercises],
        sets: workoutState.sets,
        duration: formatTime(workoutState.totalDuration)
      };
      history.unshift(session);
      localStorage.setItem('hiit_history', JSON.stringify(history));
    }

    function renderHistory() {
      const container = document.getElementById('history-container');
      const history = JSON.parse(localStorage.getItem('hiit_history') || '[]');
      
      if (history.length === 0) {
        container.innerHTML = "<p style='color:#666;'>No hay registros aún.</p>";
        return;
      }

      container.innerHTML = history.map(item => `
        <div class="history-item">
          <div class="history-date">${item.date}</div>
          <div class="history-title">${item.exercises.join(', ')}</div>
          <div style="font-size:0.85rem; color:#aaa;">${item.sets} series por ejercicio | Duración: ${item.duration} min</div>
        </div>
      `).join('');
    }

    function clearHistory() {
      if (confirm("¿Borrar todo el historial?")) {
        localStorage.removeItem('hiit_history');
        renderHistory();
      }
    }

    // Inicializar
    renderExercises();
  </script>
</body>
</html>
